name: Dev build
# Builds test copies from the dev branch so they can be tried before they go to the public releases.
# They install NEXT TO the real app (own name, own settings) and never offer updates. They are published as DRAFT releases
# (dev-windows, dev-android): a draft is visible only to people with write access to the repo, so only the owner sees it
# (github.com/NaqibC/lyric-player/releases while signed in). The real releases (latest, windows-latest, linux-latest) are not touched.
on:
  push:
    branches: [dev]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Stamp this build (no platform, so it never offers an update)
        run: |
          V="1.0.$GITHUB_RUN_NUMBER-dev"
          printf 'window.__build = { sha: "%s", platform: "", version: "%s" };\n' "$GITHUB_SHA" "$V" > app/src/phone/assets/renderer/build-info.js
          printf 'window.__build = { sha: "%s", platform: "", version: "%s" };\n' "$GITHUB_SHA" "$V" > app/src/tv/assets/renderer/build-info.js
      - name: Build the dev APKs
        run: gradle --no-daemon --stacktrace assemblePhoneDev assembleTvDev
      - name: Name the files
        run: |
          cp app/build/outputs/apk/phone/dev/app-phone-dev.apk LyricPlayer-DEV.apk
          cp app/build/outputs/apk/tv/dev/app-tv-dev.apk LyricPlayer-TV-DEV.apk
      - name: Publish as the private "dev-android" draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name=="dev-android") | .id'); do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
          git push origin --delete dev-android 2>/dev/null || true
          gh release create dev-android LyricPlayer-DEV.apk LyricPlayer-TV-DEV.apk --draft --title "Lyric Player DEV (Android test build)" --notes "A TEST build from the dev branch. It installs next to the normal app and has its own settings. Not for everyday use." --target "$GITHUB_SHA"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stamp this build (no platform, so it never offers an update)
        shell: bash
        run: |
          V="1.0.$GITHUB_RUN_NUMBER-dev"
          printf 'window.__build = { sha: "%s", platform: "", version: "%s" };\n' "$GITHUB_SHA" "$V" > windows/renderer/build-info.js
          (cd windows && npm version "$V" --no-git-tag-version --allow-same-version)
      - name: Install, test, build the portable dev .exe
        working-directory: windows
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install
          npm test
          npx electron-builder --win portable -c.productName="Lyric Player DEV" -c.appId=com.lyricplayer.app.dev '-c.portable.artifactName=Lyric-Player-DEV-${version}.exe'
      - name: Publish as the private "dev-windows" draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name=="dev-windows") | .id'); do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
          git push origin --delete dev-windows 2>/dev/null || true
          gh release create dev-windows windows/dist/Lyric-Player-DEV-*.exe --draft --title "Lyric Player DEV (Windows test build)" --notes "A TEST build from the dev branch: download and double-click, no install. It has its own name and settings, so it can run next to the normal app. Not for everyday use." --target "$GITHUB_SHA"
