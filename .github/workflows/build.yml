name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assemblePhoneDebug assembleTvDebug
      - name: Name the files
        run: |
          cp app/build/outputs/apk/phone/debug/app-phone-debug.apk LyricPlayer.apk
          cp app/build/outputs/apk/tv/debug/app-tv-debug.apk LyricPlayer-TV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LyricPlayer-apk
          path: |
            LyricPlayer.apk
            LyricPlayer-TV.apk
      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest LyricPlayer.apk LyricPlayer-TV.apk --title "Lyric Player (latest)" --notes "LyricPlayer.apk is for Android phones (and Android Auto). LyricPlayer-TV.apk is for Google TV / Android TV." --target "$GITHUB_SHA"
