name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Name the file
        run: cp app/build/outputs/apk/debug/app-debug.apk LyricPlayer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LyricPlayer-apk
          path: LyricPlayer.apk
      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest LyricPlayer.apk --title "Lyric Player (latest)" --notes "Install this file on your Android phone." --target "$GITHUB_SHA"
