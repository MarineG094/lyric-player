name: Build APK
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Stamp this build (the apps compare it with the newest release)
        run: |
          printf 'window.__build = { sha: "%s", platform: "phone" };\n' "$GITHUB_SHA" > app/src/phone/assets/renderer/build-info.js
          printf 'window.__build = { sha: "%s", platform: "tv" };\n' "$GITHUB_SHA" > app/src/tv/assets/renderer/build-info.js
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assemblePhoneDebug assembleTvDebug
      - name: Name the files
        run: |
          cp app/build/outputs/apk/phone/debug/app-phone-debug.apk LyricPlayer.apk
          cp app/build/outputs/apk/tv/debug/app-tv-debug.apk LyricPlayer-TV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LyricPlayer-apk
          path: |
            LyricPlayer.apk
            LyricPlayer-TV.apk
      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest LyricPlayer.apk LyricPlayer-TV.apk --title "Lyric Player (latest)" --notes "LyricPlayer.apk is for Android phones (and Android Auto). LyricPlayer-TV.apk is for Google TV / Android TV." --target "$GITHUB_SHA"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stamp this build (the app compares it with the newest release)
        shell: bash
        run: |
          printf 'window.__build = { sha: "%s", platform: "windows" };\n' "$GITHUB_SHA" > windows/renderer/build-info.js
      - name: Install, test, build the portable .exe
        working-directory: windows
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install
          npm test
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: LyricPlayer-windows
          path: windows/dist/Lyric-Player-*.exe
      - name: Publish as the "windows-latest" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in windows/dist/Lyric-Player-*.exe; do sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"; done
          gh release delete windows-latest --yes --cleanup-tag || true
          gh release create windows-latest windows/dist/Lyric-Player-*.exe windows/dist/Lyric-Player-*.exe.sha256 --title "Lyric Player for Windows (latest)" --notes "Lyric-Player-1.0.0.exe is the portable Windows app: download it and double-click. No install needed." --target "$GITHUB_SHA"

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stamp this build (the app compares it with the newest release)
        shell: bash
        run: |
          printf 'window.__build = { sha: "%s", platform: "linux" };\n' "$GITHUB_SHA" > windows/renderer/build-info.js
      - name: Install, test, build the .deb and AppImage
        working-directory: windows
        shell: bash
        run: |
          npm install
          npm test
          npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: LyricPlayer-linux
          path: |
            windows/dist/Lyric-Player-*.deb
            windows/dist/Lyric-Player-*.AppImage
      - name: Publish as the "linux-latest" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in windows/dist/Lyric-Player-*.AppImage; do sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"; done
          gh release delete linux-latest --yes --cleanup-tag || true
          gh release create linux-latest windows/dist/Lyric-Player-*.deb windows/dist/Lyric-Player-*.AppImage windows/dist/Lyric-Player-*.AppImage.sha256 --title "Lyric Player for Linux (latest)" --notes "Lyric-Player-1.0.0.AppImage runs on most distributions and updates itself (chmod +x, then run; on newer Ubuntu/Mint it may need the --no-sandbox option). Lyric-Player-1.0.0.deb is for Linux Mint, Ubuntu and Debian: sudo apt install ./Lyric-Player-1.0.0.deb. The .sha256 files are used by the in-app updater." --target "$GITHUB_SHA"
