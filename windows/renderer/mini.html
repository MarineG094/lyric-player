<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lyric Player mini</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @property --bg  { syntax: '<color>'; inherits: true; initial-value: #120f0d; }
  @property --bg2 { syntax: '<color>'; inherits: true; initial-value: #1a1512; }
  @property --glow{ syntax: '<color>'; inherits: true; initial-value: #c08a5e; }
  @property --acc { syntax: '<color>'; inherits: true; initial-value: #e0b48a; }
  :root { --bg: #120f0d; --bg2: #1a1512; --glow: #c08a5e; --acc: #e0b48a; --lh: 22px; --shift: 0px; transition: --bg .9s ease, --bg2 .9s ease, --glow .9s ease, --acc .9s ease; }
  * { box-sizing: border-box; margin: 0; user-select: none; -webkit-user-select: none; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: #fff; }
  .pill {
    position: relative; width: 100%; height: 100%; border-radius: 30px; overflow: hidden; padding: 12px 16px 0;
    background:
      radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--glow) 55%, transparent) 0%, transparent 62%),
      radial-gradient(90% 120% at 100% 100%, color-mix(in srgb, var(--acc) 22%, transparent) 0%, transparent 60%),
      linear-gradient(135deg, var(--bg2), var(--bg));
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .09);
    cursor: default;
  }
  .top { height: 44px; }
  .id { display: flex; align-items: center; gap: 11px; width: max-content; max-width: 100%; height: 44px; transform: translateX(var(--shift)); transition: transform .35s cubic-bezier(.22, 1, .36, 1); }
  .pill:hover .id { transform: none; }
  .cover { flex: none; width: 44px; height: 44px; border-radius: 12px; background: rgba(255, 255, 255, .08) center / cover no-repeat; box-shadow: 0 4px 14px rgba(0, 0, 0, .35); transition: filter .3s; }
  .cover.hide { filter: blur(14px) brightness(.6); }
  .meta { min-width: 0; display: flex; flex-direction: column; gap: 1px; transition: max-width .35s cubic-bezier(.22, 1, .36, 1); }
  .pill:hover .meta { max-width: 150px; }
  .title { font-size: 14px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .1px; }
  .artist { font-size: 12px; opacity: .7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .ctl { position: absolute; top: 0; right: 0; height: 74px; display: flex; align-items: flex-start; gap: 2px; padding: 12px 14px 0 40px; opacity: 0; transform: translateX(8px); pointer-events: none; transition: opacity .18s ease, transform .18s ease; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--bg) 85%, transparent) 45%); -webkit-mask-image: linear-gradient(to bottom, #000 55%, transparent); mask-image: linear-gradient(to bottom, #000 55%, transparent); }
  .pill:hover .ctl { opacity: 1; transform: none; pointer-events: auto; }
  .ctl button { margin-top: 0; all: unset; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; transition: background .12s, transform .12s; }
  .ctl button:hover { background: rgba(255, 255, 255, .16); }
  .ctl button:active { transform: scale(.9); }
  .ctl svg { width: 16px; height: 16px; fill: #fff; }
  .ctl .play { width: 34px; height: 34px; background: rgba(255, 255, 255, .92); }
  .ctl .play:hover { background: #fff; }
  .ctl .play svg { fill: #111; width: 16px; height: 16px; }
  .ctl .play .ic-pause { display: none; }
  .playing .ctl .play .ic-pause { display: block; }
  .playing .ctl .play .ic-play { display: none; }
  .ctl .exp svg { width: 14px; height: 14px; }

  .lyr { position: relative; height: calc(var(--lh) * 2); margin-top: 5px; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22%, #000 100%); mask-image: linear-gradient(to bottom, transparent 0, #000 22%, #000 100%); }
  .roll { position: absolute; inset: 0 0 auto 0; transition: transform .5s cubic-bezier(.22, 1, .36, 1); will-change: transform; }
  .l { height: var(--lh); line-height: var(--lh); font-size: 14.5px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .45s ease, font-size .3s ease; }
  .l.cur { opacity: 1; }
  .l.nx { opacity: .45; font-weight: 550; }
  .l.pv { opacity: .0; }
  .note { position: absolute; inset: 0; display: flex; align-items: center; font-size: 13.5px; opacity: .6; }
  .note[hidden] { display: none; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255, 255, 255, .08); }
  .bar i { display: block; height: 100%; width: 0; background: color-mix(in srgb, var(--acc) 85%, #fff); border-radius: 0 3px 3px 0; }
</style>
</head>
<body>
  <div class="pill" id="pill">
    <div class="top">
      <div class="id" id="idBox">
        <div class="cover" id="cover"></div>
        <div class="meta"><div class="title" id="title">Nothing playing</div><div class="artist" id="artist"></div></div>
      </div>
    </div>
    <div class="ctl" id="ctl">
      <button id="bPrev" type="button" aria-label="Previous song"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg></button>
      <button id="bPlay" class="play" type="button" aria-label="Play or pause"><svg class="ic-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg class="ic-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
      <button id="bNext" type="button" aria-label="Next song"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg></button>
      <button id="bExp" class="exp" type="button" aria-label="Open the full player" title="Open the full player"><svg viewBox="0 0 24 24"><path d="M14 3h7v7h-2V6.4l-5.3 5.3-1.4-1.4L17.6 5H14zM5 5h5v2H7v10h10v-3h2v5H5z"/></svg></button>
    </div>
    <div class="lyr"><div class="roll" id="roll"></div><div class="note" id="note">Nothing playing</div></div>
    <div class="bar"><i id="prog"></i></div>
  </div>
  <script src="mini.js"></script>
</body>
</html>
